<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Talaud Digital Market</title>
  <style>
    body { font-family: sans-serif; margin: 0; background: #f9f9f9; }
    header, footer { background: #007B8A; color: white; text-align: center; padding: 1rem; }
    nav { background: #005f6b; display: flex; justify-content: center; gap: 1rem; padding: 0.5rem; }
    nav a { color: white; text-decoration: none; font-weight: bold; }
    section { padding: 2rem; max-width: 800px; margin: auto; }
    .produk { border: 1px solid #ccc; padding: 1rem; border-radius: 8px; margin-bottom: 1rem; background: white; }
    input, textarea, button { display: block; margin-top: 0.5rem; width: 100%; padding: 0.5rem; }
    button { background: #007B8A; color: white; border: none; cursor: pointer; margin-top: 1rem; }
  </style>
</head>
<body>
  <header>
    <h1>Talaud Digital Market</h1>
  </header>

  <nav>
    <a href="#marketplace">Marketplace</a>
    <a href="#forum">Forum</a>
    <a href="#daftar">Daftar</a>
  </nav>

  <section id="marketplace">
    <h2>Marketplace</h2>
    <div class="produk">
      <h3>Ikan Segar (Kakap)</h3>
      <p>Harga: Rp 35.000/kg</p>
      <p>Kontak: 0822-1234-5678</p>
      <button onclick="alert('Hubungi langsung via WhatsApp!')">Hubungi Penjual</button>
    </div>
    <div class="produk">
      <h3>Kopra Kering</h3>
      <p>Harga: Rp 10.000/kg</p>
      <p>Kontak: 0812-4567-8901</p>
      <button onclick="alert('Hubungi langsung via WhatsApp!')">Hubungi Penjual</button>
    </div>
  </section>

  <section id="forum">
    <h2>Forum Diskusi</h2>
    <label for="komentar">Tulis Komentar:</label>
    <textarea id="komentar" rows="3" placeholder="Apa yang ingin Anda tanyakan?"></textarea>
    <button onclick="tambahKomentar()">Kirim</button>
    <div id="listKomentar"></div>
  </section>

  <section id="daftar">
    <h2>Form Pendaftaran</h2>
    <form onsubmit="alert('Pendaftaran berhasil!'); return false;">
      <input type="text" placeholder="Nama Lengkap" required />
      <input type="email" placeholder="Email" required />
      <select required>
        <option value="">Pilih Peran</option>
        <option value="petani">Petani</option>
        <option value="nelayan">Nelayan</option>
        <option value="pengusaha">UMKM / Pengusaha</option>
      </select>
      <button type="submit">Daftar</button>
    </form>
  </section>

  <footer>
    &copy; 2025 Talaud Digital Market
  </footer>

  <script>
    function tambahKomentar() {
      const text = document.getElementById('komentar').value;
      if (text.trim() === '') return;
      const div = document.createElement('div');
      div.innerHTML = `<p><strong>Pengunjung:</strong> ${text}</p>`;
      document.getElementById('listKomentar').appendChild(div);
      document.getElementById('komentar').value = '';
    }
  </script>
</body>
</html>
